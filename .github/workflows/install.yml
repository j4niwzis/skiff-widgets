# What an installed skiff-widgets is.
#
# Two libraries, one prefix: skiff is installed first and this is built
# against the installed copy, which is the arrangement a distribution would
# have and the one thing find_package(skiff) in this CMakeLists is for. Then
# a program is built against both with nothing but find_package.
name: install

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  install:
    # 26.04 because that is where Skia is packaged. What is packaged there is
    # milestone 146, and skiff is written against the gradient API of 148 --
    # so the provider compiles a program against the installed copy, finds it
    # cannot be linked against, and builds one. The store below is what keeps
    # that build, so it happens once rather than once per push.
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Clang 22 and the distribution's libstdc++: this is a C++23 module
      # library, so the compiler has to scan for imports, and every library
      # on this machine was built against libstdc++.
      - name: clang 22
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ninja-build python3 pkg-config \
            lsb-release software-properties-common gnupg curl
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"

      - name: cmake
        run: |
          version=4.3.4
          curl -sSL -o cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-x86_64.tar.gz"
          sudo tar xzf cmake.tar.gz -C /opt
          echo "/opt/cmake-${version}-linux-x86_64/bin" >> "$GITHUB_PATH"

      # What the provider will answer with where it can: the machine's own
      # Skia, and the libraries a Skia is built against, so that a build
      # which cannot take that copy takes those and builds one library
      # rather than eight. gn is Skia's build system, and a build that has
      # to make one needs it.
      - name: what a machine with development packages has
        run: |
          sudo apt-get install -y libskia-dev libgl-dev generate-ninja \
            zlib1g-dev libpng-dev libjpeg-dev libfreetype-dev \
            libharfbuzz-dev libexpat1-dev

      - name: what was built before
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cmake-everywhere/sources
            ~/.cache/cmake-everywhere/store
          key: skiff-widgets-${{ hashFiles('cmake/get_cme.cmake') }}-${{ github.sha }}
          restore-keys: skiff-widgets-${{ hashFiles('cmake/get_cme.cmake') }}-

      # Where libstdc++ keeps the source of its std module. libc++ ships a
      # manifest and libstdc++ does not, so the path is found rather than
      # asked for.
      - name: what import std reads from libstdc++
        run: |
          std=$(ls /usr/include/c++/*/bits/std.cc | sort -V | tail -1)
          cat > /tmp/libstdc++.modules.json <<EOF
          {
            "version": 1,
            "revision": 1,
            "modules": [
              { "logical-name": "std", "source-path": "$std",
                "is-std-library": true },
              { "logical-name": "std.compat",
                "source-path": "${std%std.cc}std.compat.cc",
                "is-std-library": true }
            ]
          }
          EOF

      # The library this one is built against, from its own repository and
      # installed the way a machine would have it.
      - name: skiff, installed
        run: |
          git clone --depth 1 https://github.com/j4niwzis/skiff /tmp/skiff
          cmake -S /tmp/skiff -B /tmp/skiff/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_CXX_FLAGS="-stdlib=libstdc++" \
            -DCMAKE_CXX_STDLIB_MODULES_JSON=/tmp/libstdc++.modules.json \
            -DCME_STORE_ENABLED=ON \
            -DCME_SOURCES_ENABLED=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build /tmp/skiff/build
          cmake --install /tmp/skiff/build

      - name: build and install
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_CXX_FLAGS="-stdlib=libstdc++" \
            -DCMAKE_CXX_STDLIB_MODULES_JSON=/tmp/libstdc++.modules.json \
            -DCMAKE_PREFIX_PATH="$PWD/prefix" \
            -DCME_STORE_ENABLED=ON \
            -DCME_SOURCES_ENABLED=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build
          cmake --install build

      # The tests, which are the only thing here that runs. Everything else
      # this workflow does is about whether the library can be built and
      # linked against; this is about whether what it computes is right.
      - name: the tests
        run: |
          cmake -S test -B build/test -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_CXX_FLAGS="-stdlib=libstdc++" \
            -DCMAKE_CXX_STDLIB_MODULES_JSON=/tmp/libstdc++.modules.json \
            -DCMAKE_PREFIX_PATH="$PWD/prefix" \
            -DCME_STORE_ENABLED=ON \
            -DCME_SOURCES_ENABLED=ON
          cmake --build build/test
          ctest --test-dir build/test --output-on-failure

      # What was installed, said out loud: an archive, the module sources a
      # consumer compiles its own interfaces from, a CMake package, and the
      # port declaration that describes this library to whoever answers
      # find_package(skiff) for somebody else.
      - name: what is in the prefix
        run: |
          find prefix -type f | sort
          test -f prefix/lib/cmake/skiff-widgets/skiff-widgetsConfig.cmake
          test -f prefix/lib/cmake/skiff-widgets/skiffWidgetsTargets.cmake

      # And a consumer, with nothing but find_package: no cmake-everywhere,
      # no sources of this library, only the prefix.
      #
      # It has to say two things of its own before project(), and both are
      # about `import std` rather than about this library: the experimental
      # gate CMake keeps it behind, and the request itself. An installed
      # target that was built with CXX_MODULE_STD says so, and a consumer
      # that has not enabled it is told the toolchain was never asked -- "it
      # must be set before CXX is enabled". No config file can do that for
      # the project that includes it.
      - name: something built against the installed copy
        run: |
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 4.3.4 FATAL_ERROR)
          set(CMAKE_EXPERIMENTAL_CXX_IMPORT_STD
              "451f2fe2-a8a2-47c3-bc32-94786d8fc91b")
          set(CMAKE_CXX_MODULE_STD 1)
          project(skiff_widgets_consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_EXTENSIONS OFF)
          # One find_package and one library: skiff-widgets is what this
          # program uses, and skiff underneath it is skiff-widgets' business
          # -- its config file finds it, and its target links it.
          find_package(skiff-widgets REQUIRED)
          add_executable(consumer main.cc)
          target_link_libraries(consumer PRIVATE skiff::widgets)
          EOF
          cat > /tmp/consumer/main.cc <<'EOF'
          import skiff.widgets;

          // A theme is the smallest thing here that needs the whole
          // arrangement: the module interface to compile against, the
          // archive to link, and skiff under it, which this program never
          // names.
          int main() {
            const skiff::widgets::Theme theme{};
            return theme.fCorner == 5.0f ? 0 : 1;
          }
          EOF
          cmake -S /tmp/consumer -B /tmp/consumer/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_CXX_FLAGS="-stdlib=libstdc++" \
            -DCMAKE_CXX_STDLIB_MODULES_JSON=/tmp/libstdc++.modules.json \
            -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build /tmp/consumer/build
          /tmp/consumer/build/consumer

      # The same package, asked for after skiff: a consumer may have found
      # skiff for its own reasons, and finding this one afterwards must not
      # care either way.
      - name: and with skiff found first
        run: |
          mkdir -p /tmp/consumer-both
          cp /tmp/consumer/main.cc /tmp/consumer-both/main.cc
          cat > /tmp/consumer-both/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 4.3.4 FATAL_ERROR)
          set(CMAKE_EXPERIMENTAL_CXX_IMPORT_STD
              "451f2fe2-a8a2-47c3-bc32-94786d8fc91b")
          set(CMAKE_CXX_MODULE_STD 1)
          project(skiff_widgets_consumer_both LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_EXTENSIONS OFF)
          find_package(skiff REQUIRED)
          find_package(skiff-widgets REQUIRED)
          add_executable(consumer main.cc)
          target_link_libraries(consumer PRIVATE skiff::widgets)
          EOF
          cmake -S /tmp/consumer-both -B /tmp/consumer-both/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_CXX_FLAGS="-stdlib=libstdc++" \
            -DCMAKE_CXX_STDLIB_MODULES_JSON=/tmp/libstdc++.modules.json \
            -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build /tmp/consumer-both/build
          /tmp/consumer-both/build/consumer

      # And the way the client that uses these does it: cmake-everywhere as
      # the provider, and a partial port -- where the library comes from and
      # nothing else -- declared before find_package. Here the answer is on
      # the machine, in the prefix beside this, so nothing should be fetched
      # or built at all.
      #
      # CME_OFFLINE with an empty source cache is what makes that a test
      # rather than a hope: if either library were taken from anywhere but
      # the prefix, there would be nothing to take it from.
      - name: found through cmake-everywhere, from the prefix
        run: |
          curl -sSL -o /tmp/cme.tar.gz \
            https://github.com/j4niwzis/cmake-everywhere/archive/main.tar.gz
          mkdir -p /tmp/cme && tar xzf /tmp/cme.tar.gz -C /tmp/cme --strip-components=1
          mkdir -p /tmp/consumer-cme /tmp/empty-cache
          cp /tmp/consumer/main.cc /tmp/consumer-cme/main.cc
          cat > /tmp/consumer-cme/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 4.3.4 FATAL_ERROR)
          set(CMAKE_EXPERIMENTAL_CXX_IMPORT_STD
              "451f2fe2-a8a2-47c3-bc32-94786d8fc91b")
          set(CMAKE_CXX_MODULE_STD 1)
          set(CMAKE_PROJECT_TOP_LEVEL_INCLUDES /tmp/cme/cmake-everywhere.cmake)
          project(skiff_widgets_through_cme LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_EXTENSIONS OFF)

          # Where they come from, and nothing else. What each library is,
          # what it needs and what it produces is the library's to say, and
          # it says it in the declaration installed beside it.
          cme_declare_port(NAME skiff PROVIDES skiff
            GITHUB_REPOSITORY j4niwzis/skiff GIT_TAG main)
          cme_declare_port(NAME skiff-widgets PROVIDES skiff-widgets skiff_widgets
            GITHUB_REPOSITORY j4niwzis/skiff-widgets GIT_TAG main)

          find_package(skiff-widgets REQUIRED)
          add_executable(consumer main.cc)
          target_link_libraries(consumer PRIVATE skiff::widgets)
          EOF
          cmake -S /tmp/consumer-cme -B /tmp/consumer-cme/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_CXX_FLAGS="-stdlib=libstdc++" \
            -DCMAKE_CXX_STDLIB_MODULES_JSON=/tmp/libstdc++.modules.json \
            -DCMAKE_PREFIX_PATH="$PWD/prefix" \
            -DCME_OFFLINE=ON -DCPM_SOURCE_CACHE=/tmp/empty-cache
          cmake --build /tmp/consumer-cme/build
          /tmp/consumer-cme/build/consumer
          cat /tmp/consumer-cme/build/cme-report.txt
          # Both from the machine, neither built: this is the arrangement a
          # distribution would have, and the report is where it is said.
          grep -qE "^skiff (system|pkg-config)" /tmp/consumer-cme/build/cme-report.txt
          grep -qE "^skiff-widgets (system|pkg-config)" /tmp/consumer-cme/build/cme-report.txt
